<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pantalla Días Sin Accidentes y Semáforo</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #111; color: #fff; margin: 0; padding: 20px; }
    .panel { background: #222; padding: 20px; border-radius: 8px; max-width: 650px; margin: 0 auto 20px; text-align: left; }
    .panel h2 { text-align: center; margin-top: 0; color: #00ffcc; }
    label { font-weight: bold; font-size: 14px; display: block; margin-top: 10px; }
    input[type="date"], input[type="number"], select, button { margin: 5px 0 12px; padding: 10px; font-size: 15px; width: 100%; box-sizing: border-box; border-radius: 4px; border: 1px solid #444; background: #181818; color: #fff; }
    button { cursor: pointer; border: none; font-weight: bold; font-size: 16px; margin-top: 10px; }
    
    /* Cajas del panel */
    .block-box { background: #1a1a1a; padding: 15px; border-radius: 6px; margin: 15px 0; border: 1px solid #333; }
    .record-opcion { margin-bottom: 12px; }
    .record-opcion label { cursor: pointer; display: inline; }
    .record-inputs { margin-left: 25px; margin-top: 5px; }
    .rango-fechas { display: flex; gap: 10px; }
    .disabled { opacity: 0.3; pointer-events: none; }
    
    /* Galería interactiva */
    .galeria { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 10px; max-height: 200px; overflow-y: auto; background: #181818; padding: 10px; border-radius: 6px; }
    .item-img { position: relative; display: inline-block; cursor: grab; user-select: none; }
    .item-img:active { cursor: grabbing; }
    .item-img.dragging { opacity: 0.4; }
    .item-img img { width: 70px; height: 70px; object-fit: cover; border-radius: 4px; border: 2px solid #444; pointer-events: none; }
    .btn-borrar { position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; line-height: 22px; text-align: center; cursor: pointer; font-weight: bold; border: none; padding: 0; z-index: 10; }

    /* Visor Pantalla Completa */
    #visor { display: none; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; background: black; justify-content: center; align-items: center; flex-direction: column; z-index: 9999; }
    .slide-contador { font-weight: bold; text-transform: uppercase; text-align: center; }
    img.slide-img { max-width: 100%; max-height: 100vh; object-fit: contain; }

    /* Diseños del Semáforo según Imagen */
    .semaforo-wrapper { display: flex; flex-direction: column; align-items: center; width: 92%; max-width: 1000px; background: #fff; color: #111; padding: 30px; border-radius: 12px; box-sizing: border-box; }
    .semaforo-header { font-size: 3.5rem; font-weight: 900; align-self: flex-start; margin-bottom: 20px; color: #111; }
    .semaforo-main-layout { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 20px; }
    
    /* Cuestión del Semáforo 4 luces */
    .semaforo-box-4 { background: #1e2026; border-radius: 35px; padding: 20px 25px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .luz-4 { width: 75px; height: 75px; border-radius: 50%; background: #3a3d4a; transition: all 0.3s; }
    .luz-4.rojo.active { background: #ef4444; box-shadow: 0 0 35px #ef4444; }
    .luz-4.naranja.active { background: #f97316; box-shadow: 0 0 35px #f97316; }
    .luz-4.amarillo.active { background: #eab308; box-shadow: 0 0 35px #eab308; }
    .luz-4.verde.active { background: #22c55e; box-shadow: 0 0 35px #22c55e; }

    .equal-connector { font-size: 4.5rem; font-weight: 900; color: #22c55e; }

    .semaforo-right-panel { display: flex; flex-direction: column; gap: 20px; width: 55%; }
    .legend-list { display: flex; flex-direction: column; gap: 12px; }
    .legend-item { display: flex; align-items: center; gap: 15px; font-size: 1.3rem; font-weight: 900; font-style: italic; color: #1e293b; }
    .badge-count { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-weight: 900; font-style: normal; font-size: 1.2rem; border: 1px solid rgba(0,0,0,0.2); }
    .badge-verde { background: #22c55e; color: #fff; }
    .badge-amarillo { background: #eab308; color: #000; }
    .badge-naranja { background: #f97316; color: #fff; }
    .badge-rojo { background: #ef4444; color: #fff; }

    /* Registro Histórico (Abajo) */
    .grid-registro-box { background: #f1f5f9; border: 2px solid #cbd5e1; border-radius: 20px; padding: 12px 18px; margin-top: 10px; }
    .grid-registro-title { font-size: 0.95rem; font-weight: bold; text-align: center; margin-bottom: 8px; color: #475569; }
    .grid-registro { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; justify-items: center; }
    .grid-registro.meses { grid-template-columns: repeat(6, 1fr); }
    .grid-circle { width: 34px; height: 34px; border-radius: 50%; border: 1.5 solid #94a3b8; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: bold; background: #e2e8f0; color: #334155; }
    .grid-circle.filled-verde { background: #22c55e; color: #fff; border-color: #16a34a; }
    .grid-circle.filled-amarillo { background: #eab308; color: #000; border-color: #ca8a04; }
    .grid-circle.filled-naranja { background: #f97316; color: #fff; border-color: #ea580c; }
    .grid-circle.filled-rojo { background: #ef4444; color: #fff; border-color: #dc2626; }
  </style>
</head>
<body>

  <div class="panel" id="configPanel">
    <h2>Configuración de Pantalla</h2>
    
    <label>Fecha del último accidente:</label>
    <input type="date" id="fechaAccidente">

    <!-- Configuración Récord -->
    <div class="block-box">
      <div style="font-weight: bold; margin-bottom: 10px; color: #00ffcc;">Configuración del Récord:</div>
      
      <div class="record-opcion">
        <label>
          <input type="radio" name="modoRecord" value="dias" id="modoDiasRadio" onchange="actualizarModoRecord()">
          Introducir días de récord directamente
        </label>
        <div class="record-inputs" id="contenedorDias">
          <input type="number" id="diasRecordManual" min="0">
        </div>
      </div>

      <div class="record-opcion">
        <label>
          <input type="radio" name="modoRecord" value="fechas" id="modoFechasRadio" onchange="actualizarModoRecord()">
          Calcular récord entre dos fechas
        </label>
        <div class="record-inputs" id="contenedorFechas">
          <div class="rango-fechas">
            <input type="date" id="fechaRecordInicio" title="Fecha de inicio">
            <input type="date" id="fechaRecordFin" title="Fecha de fin">
          </div>
        </div>
      </div>
    </div>

    <!-- Configuración Semáforo e Histórico -->
    <div class="block-box">
      <div style="font-weight: bold; margin-bottom: 10px; color: #00ffcc;">Configuración del Semáforo y Registro:</div>
      
      <label>Modo de visualización:</label>
      <select id="tipoPeriodo" onchange="cambiarModoPeriodo()">
        <option value="Semana">Semanal (Semanas 1 a 52)</option>
        <option value="Mes">Mensual (Enero a Diciembre)</option>
      </select>

      <label id="lblSeleccionPeriodo">Seleccionar Periodo a Editar:</label>
      <select id="periodoSeleccionado" onchange="cargarDatosPeriodo()"></select>

      <label>Estado del Semáforo para este periodo:</label>
      <select id="colorSemaforo">
        <option value="verde">Verde (Riesgo Bajo)</option>
        <option value="amarillo">Amarillo (NC Menores)</option>
        <option value="naranja">Naranja (NC Mayor)</option>
        <option value="rojo">Rojo (NC Crítica)</option>
      </select>

      <label>Conteo de Incidencias / NCs:</label>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:5px;">
        <div><span style="color:#22c55e;">●</span> Leve / Riesgo Bajo: <input type="number" id="cantVerde" value="0" min="0"></div>
        <div><span style="color:#eab308;">●</span> NC Menores: <input type="number" id="cantAmarillo" value="0" min="0"></div>
        <div><span style="color:#f97316;">●</span> NC Mayor: <input type="number" id="cantNaranja" value="0" min="0"></div>
        <div><span style="color:#ef4444;">●</span> NC Crítica: <input type="number" id="cantRojo" value="0" min="0"></div>
      </div>
    </div>

    <label>Duración por diapositiva (segundos):</label>
    <input type="number" id="duracion" value="25" min="1">

    <label>Añadir imágenes adicionales:</label>
    <input type="file" id="inputImagenes" multiple accept="image/*">

    <h3>Imágenes guardadas (Arrastra para reordenar):</h3>
    <div class="galeria" id="galeriaContenedor">
      <p style="font-size: 14px; color: #aaa;">No hay imágenes guardadas.</p>
    </div>

    <button onclick="guardarCambios()" style="background:#22c55e; color:white;">Guardar Configuración</button>
    <button onclick="iniciarVideo()" style="background:#0284c7; color:white;">Iniciar Video</button>
  </div>

  <!-- Visor en Pantalla Completa -->
  <div id="visor"></div>

  <script>
    let imagenesGuardadas = [];
    let indiceActual = 0;
    let temporizador = null;
    let draggedIndex = null;

    let historialSemanas = {};
    let historialMeses = {};

    const nombresMeses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

    window.onload = () => {
      if (localStorage.getItem('fechaAccidente')) document.getElementById('fechaAccidente').value = localStorage.getItem('fechaAccidente');
      if (localStorage.getItem('diasRecordManual')) document.getElementById('diasRecordManual').value = localStorage.getItem('diasRecordManual');
      if (localStorage.getItem('fechaRecordInicio')) document.getElementById('fechaRecordInicio').value = localStorage.getItem('fechaRecordInicio');
      if (localStorage.getItem('fechaRecordFin')) document.getElementById('fechaRecordFin').value = localStorage.getItem('fechaRecordFin');
      
      const modoGuardado = localStorage.getItem('modoRecord') || 'dias';
      if (modoGuardado === 'fechas') document.getElementById('modoFechasRadio').checked = true;
      else document.getElementById('modoDiasRadio').checked = true;
      actualizarModoRecord();

      if (localStorage.getItem('tipoPeriodo')) document.getElementById('tipoPeriodo').value = localStorage.getItem('tipoPeriodo');
      
      if (localStorage.getItem('historialSemanas')) {
        try { historialSemanas = JSON.parse(localStorage.getItem('historialSemanas')) || {}; } catch(e) {}
      }
      if (localStorage.getItem('historialMeses')) {
        try { historialMeses = JSON.parse(localStorage.getItem('historialMeses')) || {}; } catch(e) {}
      }

      cambiarModoPeriodo();

      if (localStorage.getItem('duracion')) document.getElementById('duracion').value = localStorage.getItem('duracion');
      else document.getElementById('duracion').value = "25";

      if (localStorage.getItem('imagenesApp')) {
        try { imagenesGuardadas = JSON.parse(localStorage.getItem('imagenesApp')) || []; } catch(e) { imagenesGuardadas = []; }
      }
      renderizarGaleria();
    };

    function cambiarModoPeriodo() {
      const tipo = document.getElementById('tipoPeriodo').value;
      const selector = document.getElementById('periodoSeleccionado');
      selector.innerHTML = '';

      if (tipo === 'Semana') {
        document.getElementById('lblSeleccionPeriodo').innerText = 'Seleccionar Semana a Editar:';
        for (let i = 1; i <= 52; i++) {
          const opt = document.createElement('option');
          opt.value = i;
          opt.innerText = `Semana ${i}`;
          selector.appendChild(opt);
        }
      } else {
        document.getElementById('lblSeleccionPeriodo').innerText = 'Seleccionar Mes a Editar:';
        nombresMeses.forEach((m, idx) => {
          const opt = document.createElement('option');
          opt.value = idx + 1;
          opt.innerText = m;
          selector.appendChild(opt);
        });
      }

      const periodoActivo = localStorage.getItem('periodoActivoKey') || '1';
      selector.value = periodoActivo;
      cargarDatosPeriodo();
    }

    function cargarDatosPeriodo() {
      const tipo = document.getElementById('tipoPeriodo').value;
      const id = document.getElementById('periodoSeleccionado').value;
      const registro = (tipo === 'Semana' ? historialSemanas[id] : historialMeses[id]) || { color: 'verde', verde: 0, amarillo: 0, naranja: 0, rojo: 0 };

      document.getElementById('colorSemaforo').value = registro.color || 'verde';
      document.getElementById('cantVerde').value = registro.verde || 0;
      document.getElementById('cantAmarillo').value = registro.amarillo || 0;
      document.getElementById('cantNaranja').value = registro.naranja || 0;
      document.getElementById('cantRojo').value = registro.rojo || 0;
    }

    function actualizarModoRecord() {
      const esModoFechas = document.getElementById('modoFechasRadio').checked;
      if (esModoFechas) {
        document.getElementById('contenedorFechas').classList.remove('disabled');
        document.getElementById('contenedorDias').classList.add('disabled');
      } else {
        document.getElementById('contenedorDias').classList.remove('disabled');
        document.getElementById('contenedorFechas').classList.add('disabled');
      }
    }

    function guardarCambios() {
      localStorage.setItem('fechaAccidente', document.getElementById('fechaAccidente').value);
      const modoRadio = document.querySelector('input[name="modoRecord"]:checked');
      localStorage.setItem('modoRecord', modoRadio ? modoRadio.value : 'dias');
      localStorage.setItem('diasRecordManual', document.getElementById('diasRecordManual').value);
      localStorage.setItem('fechaRecordInicio', document.getElementById('fechaRecordInicio').value);
      localStorage.setItem('fechaRecordFin', document.getElementById('fechaRecordFin').value);
      
      const tipo = document.getElementById('tipoPeriodo').value;
      const id = document.getElementById('periodoSeleccionado').value;

      const datosPeriodo = {
        color: document.getElementById('colorSemaforo').value,
        verde: parseInt(document.getElementById('cantVerde').value) || 0,
        amarillo: parseInt(document.getElementById('cantAmarillo').value) || 0,
        naranja: parseInt(document.getElementById('cantNaranja').value) || 0,
        rojo: parseInt(document.getElementById('cantRojo').value) || 0
      };

      if (tipo === 'Semana') {
        historialSemanas[id] = datosPeriodo;
        localStorage.setItem('historialSemanas', JSON.stringify(historialSemanas));
      } else {
        historialMeses[id] = datosPeriodo;
        localStorage.setItem('historialMeses', JSON.stringify(historialMeses));
      }

      localStorage.setItem('tipoPeriodo', tipo);
      localStorage.setItem('periodoActivoKey', id);

      localStorage.setItem('duracion', document.getElementById('duracion').value);
      
      try {
        localStorage.setItem('imagenesApp', JSON.stringify(imagenesGuardadas));
      } catch(e) {
        alert('Las imágenes son muy pesadas para guardarse en la memoria del navegador.');
      }
      
      alert('¡Configuración guardada correctamente!');
    }

    document.getElementById('inputImagenes').addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      let procesadas = 0;
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (event) => {
          imagenesGuardadas.push(event.target.result);
          procesadas++;
          if (procesadas === files.length) {
            try { localStorage.setItem('imagenesApp', JSON.stringify(imagenesGuardadas)); } catch(err) {}
            renderizarGaleria();
          }
        };
        reader.readAsDataURL(file);
      });
      e.target.value = '';
    });

    function renderizarGaleria() {
      const contenedor = document.getElementById('galeriaContenedor');
      if (imagenesGuardadas.length === 0) {
        contenedor.innerHTML = '<p style="font-size: 14px; color: #aaa;">No hay imágenes guardadas.</p>';
        return;
      }
      contenedor.innerHTML = '';
      imagenesGuardadas.forEach((imgSrc, index) => {
        const div = document.createElement('div');
        div.className = 'item-img';
        div.draggable = true;
        div.dataset.index = index;
        div.innerHTML = `<img src="${imgSrc}"><button class="btn-borrar" onclick="eliminarImagen(${index})">✕</button>`;
        div.addEventListener('dragstart', handleDragStart);
        div.addEventListener('dragover', handleDragOver);
        div.addEventListener('drop', handleDrop);
        div.addEventListener('dragend', handleDragEnd);
        contenedor.appendChild(div);
      });
    }

    function handleDragStart(e) { draggedIndex = parseInt(this.dataset.index); this.classList.add('dragging'); }
    function handleDragOver(e) { e.preventDefault(); }
    function handleDrop(e) {
      e.preventDefault();
      const targetIndex = parseInt(this.dataset.index);
      if (draggedIndex !== null && draggedIndex !== targetIndex) {
        const itemMovido = imagenesGuardadas.splice(draggedIndex, 1)[0];
        imagenesGuardadas.splice(targetIndex, 0, itemMovido);
        try { localStorage.setItem('imagenesApp', JSON.stringify(imagenesGuardadas)); } catch(err) {}
        renderizarGaleria();
      }
    }
    function handleDragEnd() { this.classList.remove('dragging'); draggedIndex = null; }
    function eliminarImagen(index) {
      imagenesGuardadas.splice(index, 1);
      try { localStorage.setItem('imagenesApp', JSON.stringify(imagenesGuardadas)); } catch(err) {}
      renderizarGaleria();
    }

    function obtenerDiasSinAccidentes() {
      const fecha = localStorage.getItem('fechaAccidente');
      if (!fecha) return 0;
      const inicioAccidente = new Date(fecha + 'T00:00:00');
      const hoy = new Date();
      hoy.setHours(0, 0, 0, 0);
      const diffMs = hoy - inicioAccidente;
      const dias = Math.floor(diffMs / (1000 * 60 * 60 * 24));
      return dias >= 0 ? dias : 0;
    }

    function obtenerRecordDias(diasActuales) {
      const modoRecord = localStorage.getItem('modoRecord') || 'dias';
      let diasRecordBase = 0;
      if (modoRecord === 'fechas') {
        const inicioStr = localStorage.getItem('fechaRecordInicio');
        const finStr = localStorage.getItem('fechaRecordFin');
        if (inicioStr && finStr) {
          const inicio = new Date(inicioStr + 'T00:00:00');
          const fin = new Date(finStr + 'T00:00:00');
          diasRecordBase = Math.floor((fin - inicio) / (1000 * 60 * 60 * 24));
          if (diasRecordBase < 0) diasRecordBase = 0;
        }
      } else {
        diasRecordBase = parseInt(localStorage.getItem('diasRecordManual')) || 0;
      }
      return Math.max(diasRecordBase, diasActuales);
    }

    function generarGridRegistroHTML(tipo, periodoActivoId) {
      let html = '';
      if (tipo === 'Semana') {
        html += `<div class="grid-registro-box">
                  <div class="grid-registro-title">Semanas 2026</div>
                  <div class="grid-registro">`;
        // Generar 28 círculos de ejemplo en cuadrícula (o hasta la semana activa)
        const maxSemanas = Math.max(28, parseInt(periodoActivoId) || 28);
        for (let i = 1; i <= maxSemanas; i++) {
          const reg = historialSemanas[i];
          const colorClass = reg ? `filled-${reg.color}` : '';
          html += `<div class="grid-circle ${colorClass}">${i}</div>`;
        }
        html += `</div></div>`;
      } else {
        html += `<div class="grid-registro-box">
                  <div class="grid-registro-title">Meses 2026</div>
                  <div class="grid-registro meses">`;
        for (let i = 1; i <= 12; i++) {
          const reg = historialMeses[i];
          const colorClass = reg ? `filled-${reg.color}` : '';
          const abreviatura = nombresMeses[i-1].substring(0,3);
          html += `<div class="grid-circle ${colorClass}">${abreviatura}</div>`;
        }
        html += `</div></div>`;
      }
      return html;
    }

    function mostrarSiguiente() {
      const visor = document.getElementById('visor');
      visor.innerHTML = '';

      if (indiceActual === 0) {
        /* Diapositiva 1: Contador y Récord */
        const diasActuales = obtenerDiasSinAccidentes();
        const recordDias = obtenerRecordDias(diasActuales);
        visor.innerHTML = `
          <div class="slide-contador">
            <div style="font-size: 3rem; color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.5);">DÍAS SIN ACCIDENTES</div>
            <div style="font-size: 8.5rem; color: #ffeb3b; margin: 10px 0; line-height: 1;">${diasActuales}</div>
            <div style="font-size: 2.2rem; color: #aaa; margin-top: 30px; text-shadow: 0 0 8px rgba(255,255,255,0.2);">
              RÉCORD: <span style="color: #4ade80; font-size: 3.2rem;">${recordDias}</span> DÍAS
            </div>
          </div>`;
      } else if (indiceActual === 1) {
        /* Diapositiva 2: Semáforo e Histórico según la imagen de referencia */
        const tipo = localStorage.getItem('tipoPeriodo') || 'Semana';
        const periodoId = localStorage.getItem('periodoActivoKey') || '1';
        const historialMap = tipo === 'Semana' ? historialSemanas : historialMeses;
        const datos = historialMap[periodoId] || { color: 'verde', verde: 0, amarillo: 0, naranja: 0, rojo: 0 };

        const tituloPeriodo = tipo === 'Semana' ? `Semana ${periodoId}` : `${nombresMeses[parseInt(periodoId)-1] || ''}`;

        visor.innerHTML = `
          <div class="semaforo-wrapper">
            <div class="semaforo-header">${tituloPeriodo}</div>
            
            <div class="semaforo-main-layout">
              <!-- Cuestión Semáforo 4 luces (Rojo, Naranja, Amarillo, Verde) -->
              <div class="semaforo-box-4">
                <div class="luz-4 rojo ${datos.color === 'rojo' ? 'active' : ''}"></div>
                <div class="luz-4 naranja ${datos.color === 'naranja' ? 'active' : ''}"></div>
                <div class="luz-4 amarillo ${datos.color === 'amarillo' ? 'active' : ''}"></div>
                <div class="luz-4 verde ${datos.color === 'verde' ? 'active' : ''}"></div>
              </div>

              <div class="equal-connector">=</div>

              <!-- Panel Derecho: Leyendas + Registro Inferior -->
              <div class="semaforo-right-panel">
                <div class="legend-list">
                  <div class="legend-item">
                    <div class="badge-count badge-verde">${datos.verde}</div> LEVE. RIESGO BAJO
                  </div>
                  <div class="legend-item">
                    <div class="badge-count badge-amarillo">${datos.amarillo}</div> NC MENORES . RIESGO MEDIO
                  </div>
                  <div class="legend-item">
                    <div class="badge-count badge-naranja">${datos.naranja}</div> NC MAYOR . RIESGO ALTO
                  </div>
                  <div class="legend-item">
                    <div class="badge-count badge-rojo">${datos.rojo}</div> NC CRÍTICA
                  </div>
                </div>

                <!-- Cuadrícula Histórica -->
                ${generarGridRegistroHTML(tipo, periodoId)}
              </div>
            </div>
          </div>`;
      } else {
        /* Resto de diapositivas: Imágenes */
        const imgUrl = imagenesGuardadas[indiceActual - 2];
        if (imgUrl) {
          visor.innerHTML = `<img src="${imgUrl}" class="slide-img">`;
        }
      }

      const totalSlides = 2 + imagenesGuardadas.length;
      indiceActual = (indiceActual + 1) % totalSlides;
    }

    function activarPantallaCompleta(elemento) {
      try {
        if (elemento.requestFullscreen) elemento.requestFullscreen().catch(() => {});
        else if (elemento.webkitRequestFullscreen) elemento.webkitRequestFullscreen();
        else if (elemento.msRequestFullscreen) elemento.msRequestFullscreen();
      } catch (e) {}
    }

    function iniciarVideo() {
      if (temporizador) clearInterval(temporizador);
      activarPantallaCompleta(document.documentElement);
      document.getElementById('visor').style.display = 'flex';
      
      indiceActual = 0;
      mostrarSiguiente();
      
      const duracionInput = parseInt(document.getElementById('duracion').value);
      const duracionMs = (isNaN(duracionInput) || duracionInput < 1 ? 25 : duracionInput) * 1000;
      
      temporizador = setInterval(mostrarSiguiente, duracionMs);
    }
  </script>
</body>
</html>
